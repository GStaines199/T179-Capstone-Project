# Legacy template retained for ATAK SDK examples.
# Prefer local.properties.example for SARtak development.

sdk.dir=<directory path to Android SDK>
takdev.plugin=<path to atak-gradle-takdev.jar>

# ATAK compatibility target. 5.6.0 matches the SDK at the repo root
# (ATAK CIV 5.6.0.24) and is the build default; override only to test
# against a different ATAK release.
atak.version=5.6.0

# Optional only for the operation-creator development build.
DITTO_DATABASE_ID=<Ditto database ID>
DITTO_DEVELOPMENT_TOKEN=<Ditto development/playground token>
DITTO_AUTH_URL=<Ditto auth URL>
